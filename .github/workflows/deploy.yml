name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-be:
    name: Build & push BE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push BE
        uses: docker/build-push-action@v6
        with:
          context: ./be
          push: true
          tags: |
            ghcr.io/mus460/halora-land-web/be:latest
            ghcr.io/mus460/halora-land-web/be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-fe:
    name: Build & push FE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push FE
        uses: docker/build-push-action@v6
        with:
          context: ./fe
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://halora.co.id
            API_PROXY_URL=http://be:8080
          tags: |
            ghcr.io/mus460/halora-land-web/fe:latest
            ghcr.io/mus460/halora-land-web/fe:${{ github.sha }}
          cache-from: type=gha

      - name: Prune old GHCR versions (keep last 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in "halora-land-web/be" "halora-land-web/fe"; do
            enc=${pkg//\//%2F}
            ids=$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${enc}/versions" \
              --paginate --jq '.[] | select(.metadata.container.tags != null) | .id' | tail -n +6)
            if [ -n "$ids" ]; then
              echo "Pruning: $ids"
              echo "$ids" | xargs -I{} gh api -X DELETE "/user/packages/container/${enc}/versions/{}" --silent
            fi
          done

  deploy:
    name: Deploy to VPS
    needs: [build-be, build-fe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Upload compose + Caddyfile
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /opt/halora

      - name: Pull & restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/halora
            cd /opt/halora
            if [ ! -f .env ]; then
              echo "!! Missing /opt/halora/.env — create it with JWT_SECRET=... before first deploy" >&2
              exit 1
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
